<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 재설정 - DAILY LOG</title>

    <link rel="stylesheet" href="../static/css/reset.css">
    <link rel="stylesheet" href="../static/css/login.css">
    <link rel="stylesheet" href="../static/css/id,pw.css">
    <link href="https://fonts.googleapis.com/css2?family=Nixie+One&family=Noto+Sans+KR:wght@100;400&display=swap" rel="stylesheet">

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="../static/js/reset_pw.js" defer></script>

    <style>
        .reset_container {
            max-width: 400px;
            margin: 100px auto;
            padding: 40px;
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center;
        }
        .input_group { margin-bottom: 20px; text-align: left; }
        .input_group label { display: block; margin-bottom: 8px; font-weight: 400; }
        .submit { width: 100%; margin-top: 10px; cursor: pointer; }
        .error_msg { color: #ff6b6b; font-size: 13px; margin-top: 5px; display: none; }
    </style>
</head>
<body>
    <a href="/">
        <header id="login">
            <h1>DAILY</h1>
            <h1>LOG</h1>
        </header>
    </a>

    <section>
        <div class="reset_container">
            <p class="idpw_title">새 비밀번호 설정</p>
            <p style="font-size: 14px; color: #666; margin-bottom: 30px;">안전한 비밀번호로 변경해주세요.</p>
            
            <div class="input_group">
                <label for="new_password">새 비밀번호</label>
                <input id="new_password" type="password" class="email_input" placeholder="8자 이상 입력">
            </div>

            <div class="input_group">
                <label for="confirm_password">비밀번호 확인</label>
                <input id="confirm_password" type="password" class="email_input" placeholder="비밀번호 재입력">
                <p id="pw_error" class="error_msg">비밀번호가 일치하지 않습니다.</p>
            </div>

            <input id="reset_btn" type="button" class="submit" value="비밀번호 변경하기">
        </div>
    </section>
</body>
</html>
